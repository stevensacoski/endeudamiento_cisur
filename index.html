function fromGviz(json) {

  const labelled = cols.filter((x) => x && String(x).trim()).length;

  return { headers: cols, rows };

    const cleanup = () => { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); };
    window[cb] = (json) => { done = true; try { resolve(fromGviz(json)); } catch (e) { reject(e); } finally { cleanup(); } };
    s.onerror = () => { if (!done) { reject(new Error("No se pudo leer la hoja (¿está compartida como \u201cCualquiera con el enlace\u201d?).")); cleanup(); } };
    s.src = url;
    document.head.appendChild(s);
    setTimeout(() => { if (!done) { reject(new Error("timeout")); cleanup(); } }, 15000);
  });
}
async function fetchLive() { return fetchLiveJsonp(); }

function tableFromWorkbook(ab) {
  const wb = XLSX.read(ab, { type: "array" });
  const name = wb.SheetNames.find((n) => norm(n).includes("datos")) || wb.SheetNames[0];
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "", raw: true });
  return { headers: (aoa[0] || []).map(String), rows: aoa.slice(1).filter((r) => r.some((c) => c !== "" && c != null)) };
}

function App() {
  const [records, setRecords] = useState(null);
  const [meta, setMeta] = useState({ source: null, updatedAt: null, n: 0 });
  const [status, setStatus] = useState("idle"); // idle | loading | error | ok
  const [tab, setTab] = useState("avance");
  const [flt, setFlt] = useState({ prov: "", depto: "", barrio: "", genero: "" });

  const loadLive = useCallback(async () => {
    setStatus("loading");
    try { const { headers, rows } = await fetchLive(); const recs = buildRecords(headers, rows); setRecords(recs); setMeta({ source: "live", updatedAt: new Date(), n: recs.length }); setStatus("ok"); }
    catch (e) { setStatus("error"); }
  }, []);
  useEffect(() => { loadLive(); }, [loadLive]);

  const onFile = async (file) => {
    if (!file) return; setStatus("loading");
    try { const ab = await file.arrayBuffer(); const { headers, rows } = tableFromWorkbook(ab); const recs = buildRecords(headers, rows); setRecords(recs); setMeta({ source: "file:" + file.name, updatedAt: new Date(), n: recs.length }); setStatus("ok"); }
    catch (e) { setStatus("error"); }
  };
  const loadDemo = () => { const recs = makeDemo(); setRecords(recs); setMeta({ source: "demo", updatedAt: new Date(), n: recs.length }); setStatus("ok"); };

  // options for filters (cascading)
  const opts = useMemo(() => {
    if (!records) return { prov: [], depto: [], barrio: [], genero: [] };
    const uniq = (arr) => [...new Set(arr)].filter((x) => x && x !== "Sin dato").sort((a, b) => a.localeCompare(b, "es"));
    const inProv = records.filter((r) => !flt.prov || r.provincia === flt.prov);
    const inDepto = inProv.filter((r) => !flt.depto || r.departamento === flt.depto);
    return { prov: uniq(records.map((r) => r.provincia)), depto: uniq(inProv.map((r) => r.departamento)), barrio: uniq(inDepto.map((r) => r.barrio)), genero: uniq(records.map((r) => r.genero)) };
  }, [records, flt.prov, flt.depto]);

  const data = useMemo(() => {
    if (!records) return [];
    return records.filter((r) => (!flt.prov || r.provincia === flt.prov) && (!flt.depto || r.departamento === flt.depto) && (!flt.barrio || r.barrio === flt.barrio) && (!flt.genero || r.genero === flt.genero));
  }, [records, flt]);

  if (!records && status !== "ok") return <Landing status={status} onRetry={loadLive} onFile={onFile} onDemo={loadDemo} />;

  return (
    <div style={{ background: T.paper, fontFamily: sans, minHeight: "100vh", color: T.ink }}>
      <style>{`*{box-sizing:border-box} select{-webkit-appearance:none;appearance:none} ::-webkit-scrollbar{height:8px;width:8px} ::-webkit-scrollbar-thumb{background:${T.line};border-radius:8px}`}</style>
      <Header meta={meta} status={status} onRefresh={loadLive} onFile={onFile} />
      <Filters flt={flt} setFlt={setFlt} opts={opts} n={data.length} total={records.length} />
      <Tabs tab={tab} setTab={setTab} />
      <div className="max-w-6xl mx-auto px-3 sm:px-5 pb-16">
        {data.length === 0 ? <Card className="p-10 mt-4"><Empty /></Card> :
          tab === "avance" ? <Avance data={data} /> :
          tab === "hogares" ? <Hogares data={data} /> :
          tab === "deuda" ? <Deuda data={data} /> :
          <Vulnerabilidad data={data} />}
      </div>
      <footer style={{ color: T.faint }} className="max-w-6xl mx-auto px-5 pb-10 text-xs">
        CISUR · Encuesta de endeudamiento en barrios populares · Los porcentajes se calculan sobre los hogares de la selección activa (n indicado en cada bloque).
      </footer>
    </div>
  );
}

function Avance({ data }) {
  const provincias = new Set(data.map((r) => r.provincia));
  const deptos = new Set(data.map((r) => r.provincia + "|" + r.departamento));
  const barrios = new Set(data.map((r) => r.provincia + "|" + r.barrio));
  const surveyors = new Set(data.map((r) => r.surveyor));
  const byProv = countBy(data, (r) => r.provincia);
  const bySurv = countBy(data, (r) => r.surveyor);
  const timeSeries = useMemo(() => {
    const withDate = data.filter((r) => r.submittedAt);
    if (!withDate.length) return null;
    const byDay = {};
    withDate.forEach((r) => { const k = r.submittedAt.toISOString().slice(0, 10); byDay[k] = (byDay[k] || 0) + 1; });
    const days = Object.keys(byDay).sort();
    let acc = 0;
    return days.map((d) => { acc += byDay[d]; return { dia: d.slice(5), Encuestas: byDay[d], Acumulado: acc }; });
  }, [data]);
  // coverage table
  const cover = useMemo(() => {
    const m = {};
    data.forEach((r) => { const k = [r.provincia, r.departamento, r.localidad, r.barrio].join("§"); m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).map(([k, v]) => { const [prov, depto, loc, barrio] = k.split("§"); return { prov, depto, loc, barrio, n: v }; }).sort((a, b) => b.n - a.n);
  }, [data]);

  return (
    <div className="mt-4 space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        <KPI label="Encuestas" value={fmtInt(data.length)} icon={Activity} />
        <KPI label="Provincias" value={fmtInt(provincias.size)} color={T.indigo} icon={MapPin} />
        <KPI label="Departamentos" value={fmtInt(deptos.size)} color={T.indigo} />
        <KPI label="Barrios" value={fmtInt(barrios.size)} color={T.olive} icon={Building2} />
        <KPI label="Encuestadores/as" value={fmtInt(surveyors.size)} color={T.amber} icon={Users} />
      </div>

      {timeSeries && (
        <Section title="Ritmo de relevamiento" hint="Encuestas cargadas por día y total acumulado" icon={Activity}>
          <div style={{ height: 220 }}>
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={timeSeries} margin={{ top: 6, right: 8, left: -18, bottom: 0 }}>
                <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={T.petrol} stopOpacity={0.25} /><stop offset="100%" stopColor={T.petrol} stopOpacity={0} /></linearGradient></defs>

      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Encuestas por provincia" icon={MapPin}>

        </Section>
        <Section title="Encuestas por encuestador/a" icon={Users}>
          <RankBars items={bySurv.map((d) => ({ label: d.key, value: d.n, color: T.indigo }))} showPct denom={data.length} />
        </Section>
      </div>

      <Section title="Cobertura territorial" hint={`${cover.length} barrios relevados en la selección`} icon={Layers}>
        <div className="overflow-x-auto -mx-1">
          <table className="w-full text-xs" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ color: T.faint, borderBottom: `1px solid ${T.line}` }} className="text-left">
                <th className="py-2 px-1 font-medium">Provincia</th><th className="py-2 px-1 font-medium">Departamento</th>
                <th className="py-2 px-1 font-medium">Localidad</th><th className="py-2 px-1 font-medium">Barrio</th>
                <th className="py-2 px-1 font-medium text-right">Encuestas</th>
              </tr>
            </thead>
            <tbody>
              {cover.map((r, i) => (
                <tr key={i} style={{ borderBottom: `1px solid ${T.paper}`, color: T.ink }}>
                  <td className="py-2 px-1">{r.prov}</td><td className="py-2 px-1" style={{ color: T.muted }}>{r.depto}</td>
                  <td className="py-2 px-1" style={{ color: T.muted }}>{r.loc}</td><td className="py-2 px-1">{r.barrio}</td>
                  <td className="py-2 px-1 text-right font-medium" style={{ fontVariantNumeric: "tabular-nums" }}>{r.n}</td>

/* ─────────────────  TAB: HOGARES  ───────────────── */
function Hogares({ data }) {
  const ingMed = median(data.map((r) => r.ingTotal).filter((x) => x > 0));
  const perCap = median(data.map((r) => (r.personasHogar > 0 ? r.ingTotal / r.personasHogar : NaN)));
  const hogarMed = median(data.map((r) => r.personasHogar));
  const comida = data.filter((r) => r.disminuyoComida).length;
  const ingComp = [
    { name: "Trabajo / changas", v: data.reduce((s, r) => s + (r.ingT || 0), 0), c: T.petrol },
    { name: "Programas sociales", v: data.reduce((s, r) => s + (r.ingP || 0), 0), c: T.indigo },
    { name: "Jubilaciones / pensiones", v: data.reduce((s, r) => s + (r.ingJ || 0), 0), c: T.amber },
    { name: "Otros", v: data.reduce((s, r) => s + (r.ingO || 0), 0), c: T.olive },
  ].filter((x) => x.v > 0);
  const gastosLbl = { alimentacion: "Alimentación", alquiler: "Alquiler", servicios: "Servicios", salud: "Salud", educacion: "Educación", indumentaria: "Indumentaria", electro_muebles: "Electro / muebles", transporte: "Transporte", pago_deudas: "Pago de deudas", mejoras_vivienda: "Mejoras vivienda" };
  const gastosTop = Object.keys(gastosLbl).map((k) => ({ label: gastosLbl[k], value: data.filter((r) => r.gastosTop.has(k)).length })).filter((x) => x.value).sort((a, b) => b.value - a.value);
  const edades = histogram(data.map((r) => r.edad).filter(isFinite), [18, 30, 40, 50, 60, 120], ["18–29", "30–39", "40–49", "50–59", "60+"]);
  const generos = countBy(data, (r) => r.genero);

  return (
    <div className="mt-4 space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPI label="Ingreso del hogar (mediana)" value={fmtARS(ingMed)} sub="mensual" icon={Wallet} />
        <KPI label="Ingreso por persona (mediana)" value={fmtARS(perCap)} color={T.indigo} />
        <KPI label="Tamaño del hogar (mediana)" value={fmtInt(hogarMed)} sub="personas" color={T.olive} icon={Users} />
        <KPI label="Redujeron comidas" value={pct(comida, data.length) + "%"} sub={`${comida} de ${data.length} hogares`} color={T.clay} icon={Utensils} />
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Composición del ingreso" hint="Sobre el total agregado de la selección" icon={Wallet}>
          <Donut data={ingComp} fmt={fmtARS} />
        </Section>
        <Section title="Género de la persona encuestada" icon={Users}>
          <RankBars items={generos.map((d, i) => ({ label: d.key, value: d.n, color: CAT[i % CAT.length] }))} showPct denom={data.length} />
        </Section>
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Edad de la persona encuestada" icon={Users}>
          <RankBars items={edades.map((d) => ({ label: d.label, value: d.n, color: T.indigo }))} showPct denom={data.length} />
        </Section>
        <Section title="Principales rubros de gasto" hint="Hogares que lo señalan entre sus 3 gastos mayores" icon={Layers}>
          <RankBars items={gastosTop} showPct denom={data.length} />
        </Section>
      </div>
    </div>
  );
}

/* ─────────────────  TAB: ENDEUDAMIENTO  ───────────────── */
function Deuda({ data }) {
  const n = data.length;
  const conDeuda = data.filter((r) => r.tieneDeuda);
  const nD = conDeuda.length;
  const mora = data.filter((r) => r.inArrears).length;
  const sobre = data.filter((r) => r.overIndebted).length;

  const credLbl = { banco: "Banco / crédito personal", financiera: "Financiera", fintech: "Fintech / billetera / app", tarjeta_banco: "Tarjeta bancaria", tarjeta_comercio: "Tarjeta de comercio", cuotas_comercio: "Cuotas en comercio", fiado: "Fiado en el barrio", prestamista: "Prestamista (gota a gota)", familiar: "Familiar / conocido", cooperativa: "Cooperativa / mutual", servicios: "Servicios vencidos", alquiler: "Alquiler vencido" };
  const credGroup = { banco: "formal", financiera: "formal", fintech: "formal", tarjeta_banco: "formal", tarjeta_comercio: "formal", cuotas_comercio: "formal", cooperativa: "formal", fiado: "informal", prestamista: "informal", familiar: "informal", servicios: "oblig", alquiler: "oblig" };
  const groupColor = { formal: T.indigo, informal: T.clay, oblig: T.amber };
  const cred = Object.keys(credLbl).map((k) => ({ key: k, label: credLbl[k], value: data.filter((r) => r.creditors[k]).length, color: groupColor[credGroup[k]] })).sort((a, b) => b.value - a.value);

  const usa = (grp) => data.filter((r) => Object.keys(credGroup).some((k) => credGroup[k] === grp && r.creditors[k])).length;
  const spectrum = [
    { name: "Crédito formal", v: usa("formal"), c: T.indigo },
    { name: "Fuentes informales", v: usa("informal"), c: T.clay },
    { name: "Obligaciones vencidas", v: usa("oblig"), c: T.amber },
  ].filter((x) => x.v > 0);

  const fintech = data.filter((r) => r.creditors.fintech).length;
  const gota = data.filter((r) => r.creditors.prestamista).length;
  const apuestas = data.filter((r) => r.atribucion.has("apuestas") || r.debts.some((d) => norm(d.motivo).includes("apuesta"))).length;
  const bicicleta = data.filter((r) => r.refinancio || r.atribucion.has("pago_deuda") || r.debts.some((d) => norm(d.motivo).includes("otra deuda"))).length;

  const atribLbl = { ingresos_insuf: "Ingresos insuficientes", aumento_precios: "Aumento de precios", perdida_empleo: "Pérdida de empleo / ingresos", alimentos: "Compra de alimentos", alquiler: "Pago de alquiler", servicios: "Pago de servicios", salud: "Salud / medicamentos", educacion: "Gastos escolares", vivienda: "Mejora de vivienda", inversion_laboral: "Inversión laboral", pago_deuda: "Pagar otra deuda", apuestas: "Apuestas / juego online", emergencia: "Emergencia imprevista" };
  const atrib = Object.keys(atribLbl).map((k) => ({ label: atribLbl[k], value: data.filter((r) => r.atribucion.has(k)).length, color: k === "apuestas" ? T.clay : T.petrol })).filter((x) => x.value).sort((a, b) => b.value - a.value);

  const antigOrder = ["Hace menos de 6 meses", "Entre 6 meses y 1 año", "Entre 1 y 2 años", "Entre 2 y 4 años", "Hace más de 4 años", "No sabe / no recuerda"];
  const antig = ordered(countBy(conDeuda, (r) => r.antiguedad), antigOrder).map((d) => ({ label: d.key, value: d.n, color: T.olive }));

  const bcraOrder = ["Está al día / no tiene atraso", "Hasta 31 días de atraso", "Más de 31 y hasta 90 días", "Más de 90 y hasta 180 días", "Más de 180 días y hasta 1 año", "Más de 1 año y hasta 2 años", "Más de 2 años y hasta 3 años", "Más de 3 años y hasta 4 años", "Más de 4 años", "No sabe / no recuerda"];
  const bcraCount = {};
  data.forEach((r) => r.debts.forEach((d) => { const k = String(d.alDia || "").trim(); if (k) bcraCount[k] = (bcraCount[k] || 0) + 1; }));
  const totalDebts = Object.values(bcraCount).reduce((a, b) => a + b, 0);
  const bcra = ordered(Object.entries(bcraCount).map(([key, n]) => ({ key, n })), bcraOrder).map((d) => ({ label: d.key, value: d.n, color: norm(d.key).includes("al dia") ? T.petrol : norm(d.key).includes("no sabe") ? T.faint : T.amber }));

  return (
    <div className="mt-4 space-y-4">
      {/* three distinct indicators */}
      <div className="grid md:grid-cols-3 gap-3">
        <Indicator title="Endeudamiento" value={pct(nD, n)} count={nD} total={n} color={T.petrol} bg={T.petrolSoft} icon={Wallet}
          def="Hogares con al menos una deuda, préstamo o pago pendiente vigente." />
        <Indicator title="Mora / atraso" value={pct(mora, n)} count={mora} total={n} color={T.amber} bg={T.amberSoft} icon={TrendingDown}
          def="Hogares con al menos una deuda con atraso en el pago (según situación BCRA)." />
        <Indicator title="Sobreendeudamiento" value={pct(sobre, n)} count={sobre} total={n} color={T.clay} bg={T.claySoft} icon={AlertTriangle}
          def="Cumple ≥1 de: destina ≥25% del ingreso a deuda · paga con mucha dificultad o no puede · redujo alimentación para pagar." />
      </div>

      <Section title="Espectro de acreedores" hint="Prevalencia por tipo de fuente · un hogar puede tener varias" icon={HandCoins}
        right={<div className="hidden sm:flex gap-2"><Pill color={T.indigo} bg={T.indigoSoft}>formal</Pill><Pill color={T.clay} bg={T.claySoft}>informal</Pill><Pill color={T.amber} bg={T.amberSoft}>vencidas</Pill></div>}>
        <RankBars items={cred} showPct denom={n} />
      </Section>

      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Formal vs. informal" hint="Hogares que usan cada tipo de fuente" icon={Layers}>
          <Donut data={spectrum} fmt={fmtInt} suffix=" hogares" />
        </Section>
        <Section title="Señales de alerta" hint="Motores emergentes de endeudamiento" icon={AlertTriangle}>
          <div className="grid grid-cols-2 gap-3">
            <MiniStat label="Fintech / billeteras" value={pct(fintech, n)} count={fintech} icon={Smartphone} color={T.indigo} />
            <MiniStat label="Prestamista (gota a gota)" value={pct(gota, n)} count={gota} icon={HandCoins} color={T.clay} />
            <MiniStat label="Apuestas / juego online" value={pct(apuestas, n)} count={apuestas} icon={Dice5} color={T.clay} />
            <MiniStat label="Deuda para pagar deuda" value={pct(bicicleta, n)} count={bicicleta} icon={Recycle} color={T.amber} />
          </div>
        </Section>
      </div>

      <div className="grid md:grid-cols-2 gap-4">
        <Section title="¿A qué atribuyen el endeudamiento?" hint="Respuesta múltiple" icon={Info}>
          <RankBars items={atrib} showPct denom={n} />
        </Section>
        <Section title="Antigüedad del endeudamiento" icon={Activity}>
          <RankBars items={antig} showPct denom={nD} />
        </Section>
      </div>

      <Section title="Estado de las deudas (situación BCRA)" hint={`Sobre ${fmtInt(totalDebts)} deudas caracterizadas (hasta 3 por hogar)`} icon={TrendingDown}>
        <RankBars items={bcra} showPct denom={totalDebts} />
      </Section>
    </div>
  );
}

/* ─────────────────  TAB: VULNERABILIDAD  ───────────────── */
function Vulnerabilidad({ data }) {
  const n = data.length;
  const coLbl = { llamados: "Llamados / mensajes reiterados", contacto_terceros: "Contacto a familiares o trabajo", visitas: "Visitas al domicilio", exposicion_publica: "Exposición pública o en redes", amenazas_verbales: "Amenazas verbales", amenazas_fisicas: "Amenazas o daños físicos", retencion_bienes: "Retención de documentos o bienes" };
  const grave = ["amenazas_fisicas", "retencion_bienes"];
  const co = Object.keys(coLbl).map((k) => ({ label: coLbl[k], value: data.filter((r) => r.coercion.has(k)).length, color: grave.includes(k) ? T.clay : k === "amenazas_verbales" ? "#C25B3A" : T.amber })).filter((x) => x.value).sort((a, b) => b.value - a.value);
  const conCoercion = data.filter((r) => [...r.coercion].some((k) => k !== "sin_presion" && k !== "prefiere_no")).length;
  const conGrave = data.filter((r) => grave.some((k) => r.coercion.has(k))).length;

  const nivelOrder = ["Nada", "Un poco", "Bastante", "Mucho", "Muchísimo"];
  const nivel = ordered(countBy(data, (r) => r.afectacionNivel), nivelOrder).filter((d) => d.key).map((d, i) => ({ label: d.key, value: d.n, color: ["#9AA0A6", T.olive, T.amber, "#C25B3A", T.clay][nivelOrder.indexOf(d.key)] || T.petrol }));
  const ambLbl = { sueno: "Sueño / descanso", animo: "Ánimo / estado emocional", salud_fisica: "Salud física", relaciones: "Relación familiar / pareja", concentracion: "Concentración" };
  const amb = Object.keys(ambLbl).map((k) => ({ label: ambLbl[k], value: data.filter((r) => r.afect.has(k)).length, color: T.indigo })).filter((x) => x.value).sort((a, b) => b.value - a.value);

  const redLbl = { alimentacion: "Alimentación", salud: "Salud / medicamentos", educacion: "Educación", servicios: "Servicios", transporte: "Transporte", indumentaria: "Indumentaria", recreacion: "Recreación", vivienda: "Vivienda", trabajo: "Trabajo / emprendimiento", pago_deudas: "Otras deudas", alquiler: "Alquiler" };
  const red = Object.keys(redLbl).map((k) => ({ label: redLbl[k], value: data.filter((r) => r.redujo.has(k)).length, color: k === "alimentacion" || k === "salud" ? T.clay : T.amber })).filter((x) => x.value).sort((a, b) => b.value - a.value);

  const comida = data.filter((r) => r.disminuyoComida).length;
  const comedor = data.filter((r) => r.comedor).length;
  const sitOrder = ["Empeoró", "Se mantuvo igual", "Mejoró"];
  const sit = ordered(countBy(data, (r) => r.situacion), sitOrder).filter((d) => d.key).map((d) => ({ label: d.key, value: d.n, color: d.key === "Empeoró" ? T.clay : d.key === "Mejoró" ? T.olive : T.faint }));

  // gender × over-indebtedness
  const gx = ["Mujer", "Varón"].map((g) => { const sub = data.filter((r) => r.genero === g); return { genero: g, n: sub.length, sobre: sub.filter((r) => r.overIndebted).length, coer: sub.filter((r) => [...r.coercion].some((k) => k !== "sin_presion" && k !== "prefiere_no")).length }; }).filter((x) => x.n);

  return (
    <div className="mt-4 space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPI label="Con prácticas de cobranza" value={pct(conCoercion, n) + "%"} sub={`${conCoercion} de ${n}`} color={T.amber} icon={ShieldAlert} />
        <KPI label="Con prácticas graves" value={fmtInt(conGrave)} sub="amenazas físicas o retención de bienes" color={T.clay} icon={AlertTriangle} />
        <KPI label="Redujeron alimentación" value={pct(comida, n) + "%"} sub={`${comida} hogares`} color={T.clay} icon={Utensils} />
        <KPI label="Asisten a comedor / vianda" value={pct(comedor, n) + "%"} sub={`${comedor} hogares`} color={T.amber} />
      </div>

      <Section title="Prácticas de cobranza coercitiva" hint="Desagregadas por tipo · rojo = prácticas graves" icon={ShieldAlert}>
        {co.length ? <RankBars items={co} showPct denom={n} /> : <Empty />}
      </Section>

      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Impacto en el bienestar" hint="Cuánto afectan las deudas la vida diaria" icon={Activity}>
          <RankBars items={nivel} showPct denom={n} />
        </Section>
        <Section title="Ámbitos afectados" hint="Respuesta múltiple" icon={Activity}>
          <RankBars items={amb} showPct denom={n} />
        </Section>
      </div>

      <Section title="Ajustes para poder pagar" hint="Qué gastos redujeron o dejaron de pagar · rojo = alimentación y salud" icon={TrendingDown}>
        <RankBars items={red} showPct denom={n} />
      </Section>

      <div className="grid md:grid-cols-2 gap-4">
        <Section title="Situación económica percibida" hint="En el último año" icon={Info}>
          <RankBars items={sit} showPct denom={n} />
        </Section>
        {gx.length > 0 && (
          <Section title="Brecha de género" hint="Sobreendeudamiento y cobranza coercitiva por género de la persona encuestada" icon={Users}>
            <div className="space-y-3">
              {gx.map((g) => (
                <div key={g.genero}>
                  <div className="flex justify-between text-xs mb-1"><span style={{ color: T.ink }} className="font-medium">{g.genero}</span><span style={{ color: T.faint }}>n={g.n}</span></div>
                  <div className="flex gap-2">
                    <div className="flex-1">
                      <div className="flex justify-between text-xs mb-0.5"><span style={{ color: T.muted }}>Sobreendeud.</span><span style={{ color: T.clay }} className="font-medium">{pct(g.sobre, g.n)}%</span></div>
                      <div style={{ background: T.paper }} className="h-1.5 rounded-full"><div style={{ width: pct(g.sobre, g.n) + "%", background: T.clay }} className="h-full rounded-full" /></div>
                    </div>
                    <div className="flex-1">
                      <div className="flex justify-between text-xs mb-0.5"><span style={{ color: T.muted }}>Cobranza coerc.</span><span style={{ color: T.amber }} className="font-medium">{pct(g.coer, g.n)}%</span></div>
                      <div style={{ background: T.paper }} className="h-1.5 rounded-full"><div style={{ width: pct(g.coer, g.n) + "%", background: T.amber }} className="h-full rounded-full" /></div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </Section>
        )}
      </div>
    </div>
  );
}

/* ─────────────────  SHARED WIDGETS  ───────────────── */
function Indicator({ title, value, count, total, color, bg, icon: Icon, def }) {
  return (
    <Card className="p-4" style={{ borderTop: `3px solid ${color}` }}>
      <div className="flex items-center justify-between">
        <span style={{ color: T.ink }} className="text-sm font-semibold">{title}</span>
        <span style={{ background: bg, color }} className="p-1.5 rounded-lg"><Icon size={15} /></span>
      </div>
      <div className="flex items-end gap-2 mt-2">
        <span style={{ color, fontFamily: serif }} className="text-4xl leading-none">{value}%</span>
        <span style={{ color: T.faint }} className="text-xs mb-1">{fmtInt(count)} de {fmtInt(total)} hogares</span>
      </div>
      <p style={{ color: T.muted }} className="text-xs mt-2.5 leading-snug">{def}</p>
    </Card>
  );
}
function MiniStat({ label, value, count, icon: Icon, color }) {
  return (
    <div style={{ background: T.paper }} className="rounded-lg p-3">
      <div className="flex items-center gap-1.5"><Icon size={14} style={{ color }} /><span style={{ color: T.muted }} className="text-xs">{label}</span></div>
      <div className="flex items-baseline gap-1.5 mt-1"><span style={{ color: T.ink, fontFamily: serif }} className="text-2xl leading-none">{value}%</span><span style={{ color: T.faint }} className="text-xs">{fmtInt(count)}</span></div>
    </div>
  );
}
function Donut({ data, fmt = fmtInt, suffix = "" }) {
  const total = data.reduce((s, d) => s + d.v, 0);
  if (!total) return <Empty />;
  return (
    <div className="flex items-center gap-4 flex-col sm:flex-row">
      <div style={{ width: 150, height: 150 }} className="shrink-0">
        <ResponsiveContainer width="100%" height="100%">
          <PieChart>
            <Pie data={data} dataKey="v" nameKey="name" innerRadius={44} outerRadius={72} paddingAngle={2} stroke="none">
              {data.map((d, i) => <Cell key={i} fill={d.c} />)}
            </Pie>
            <Tooltip formatter={(v, n) => [fmt(v) + suffix, n]} contentStyle={{ fontSize: 12, borderRadius: 8, border: `1px solid ${T.line}` }} />
          </PieChart>
        </ResponsiveContainer>
      </div>
      <div className="flex-1 w-full space-y-1.5">
        {data.map((d, i) => (
          <div key={i} className="flex items-center justify-between text-xs">
            <span className="flex items-center gap-2" style={{ color: T.ink }}><span style={{ background: d.c, width: 10, height: 10, borderRadius: 3, display: "inline-block" }} />{d.name}</span>
            <span style={{ color: T.muted, fontVariantNumeric: "tabular-nums" }} className="font-medium">{pct(d.v, total)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─────────────────  AGG UTILS  ───────────────── */
function countBy(arr, keyFn) {
  const m = {};
  arr.forEach((r) => { const k = keyFn(r) || "Sin dato"; m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).map(([key, n]) => ({ key, n })).sort((a, b) => b.n - a.n);
}
function ordered(counts, order) {
  const m = {}; counts.forEach((c) => (m[c.key] = c.n));
  const known = order.filter((o) => m[o] != null).map((o) => ({ key: o, n: m[o] }));
  const extra = counts.filter((c) => !order.includes(c.key));
  return [...known, ...extra];
}
function histogram(vals, edges, labels) {
  const bins = labels.map((label) => ({ label, n: 0 }));
  vals.forEach((v) => { for (let i = 0; i < labels.length; i++) { if (v >= edges[i] && v < edges[i + 1]) { bins[i].n++; break; } } });
  return bins.filter((b) => b.n > 0);
}
